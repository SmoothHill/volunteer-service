    root-dir: ${APP_STORAGE_ROOT_DIR:./storage}
    public-prefix: /files
    cos-bucket: ${APP_STORAGE_COS_BUCKET:}
    cos-region: ${APP_STORAGE_COS_REGION:}
    cos-secret-id: ${APP_STORAGE_COS_SECRET_ID:}
    cos-secret-key: ${APP_STORAGE_COS_SECRET_KEY:}
    cos-base-path: ${APP_STORAGE_COS_BASE_PATH:volunteer}
