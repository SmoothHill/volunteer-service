server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    context-path: /

spring:
  application:
    name: volunteer-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/volunteer_service?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${SPRING_REDIS_HOST:yuepin}
    port: ${SPRING_REDIS_PORT:6379}
    database: ${SPRING_REDIS_DATABASE:0}
    password: ${SPRING_REDIS_PASSWORD:}
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${APP_JWT_SECRET:local-jwt-secret-change-me}
    expire-hours: ${APP_JWT_EXPIRE_HOURS:72}
  super-admin:
    web-username: ${APP_SUPER_ADMIN_USERNAME:superadmin}
    web-password: ${APP_SUPER_ADMIN_PASSWORD:123456}
  local-test-login:
    enabled: ${APP_LOCAL_TEST_LOGIN_ENABLED:true}
    volunteer-open-id: ${APP_LOCAL_TEST_LOGIN_OPEN_ID:local_test_volunteer}
    volunteer-name: ${APP_LOCAL_TEST_LOGIN_NAME:LocalTestVolunteer}
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:true}
  sensitive:
    encryption-key: ${APP_SENSITIVE_ENCRYPTION_KEY:1234567890abcdef}
    hash-salt: ${APP_SENSITIVE_HASH_SALT:volunteer-local-salt}
  login-verification:
    enabled: ${APP_LOGIN_VERIFICATION_ENABLED:false}
    code-expire-minutes: ${APP_LOGIN_VERIFICATION_EXPIRE_MINUTES:5}
    resend-cooldown-seconds: ${APP_LOGIN_VERIFICATION_RESEND_SECONDS:60}
    sms-mode: ${APP_LOGIN_VERIFICATION_SMS_MODE:prod}
  tencent-map:
    web-service-key: ${APP_TENCENT_MAP_WEB_SERVICE_KEY:}
    web-service-secret-key: ${APP_TENCENT_MAP_WEB_SERVICE_SECRET_KEY:}
    api-base-url: https://apis.map.qq.com
  notification:
    activity-reminder-minutes: 60
    reminder-scan-delay-ms: 600000
    dispatch-mode: HYBRID
    template-ids:
      ENROLLMENT_APPROVED: BFvieOX5I-hnmuxwbwAIBZlxaQu2gLMob6s1k46eS7M
      ENROLLMENT_REJECTED: BFvieOX5I-hnmuxwbwAIBZlxaQu2gLMob6s1k46eS7M
